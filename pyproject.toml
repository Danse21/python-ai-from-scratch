[project]
name = "python-ai-from-scratch"
version = "0.1.0"
requires-python = ">=3.12, <3.13"
dependencies = [
    # Core Utilities and Data
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.1.0,<3.0.0",
    "numpy>=1.26.4,<2.0.0",
    "matplotlib>=3.8.0",
    # Bioinformatics and Drug Discovery Framework
    "biopython>=1.83",
    "deepchem>=2.7.1",
    "fair-esm>=2.0.0",
    # Web & Database
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "aiosqlite>=0.20.1",
    # Machine Learning & Deep Learning
    "scikit-learn>=1.4.0",
    "transformers>=4.38.0, <4.44.0",
    "sentence-transformers>=2.6.0",
    "chromadb>=0.5.0",
    "torchvision>=0.17.2",
    "groq",
    "langchain>=1.3.14",
    "langchain-groq>=1.1.3",
    # Dynamic PyTorch targeting Intel Mac (2.2.2) vs Linux/Docker (>=2.4.0)
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.4.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=8.0.0",
]

[tool.uv]
# evaluate both Mac x86_64 and Linux environments
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux'"
]
